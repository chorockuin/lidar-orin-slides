<script>
(function(){
"use strict";
/* ============================================================
   helpers
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
function S(tag, attrs, parent, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r){ let u = 0, v = 0; while(!u) u = r(); while(!v) v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function prep(c){
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return null;
  const d = 2;
  if (c.width !== w*d || c.height !== h*d){ c.width = w*d; c.height = h*d; }
  const ctx = c.getContext('2d');
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, w, h};
}
function hexA(hex, a){
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(x=>x+x).join('');
  const n = parseInt(hex,16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
function lerpHex(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round((pa>>16&255)*(1-t)+(pb>>16&255)*t), g = Math.round((pa>>8&255)*(1-t)+(pb>>8&255)*t), bl = Math.round((pa&255)*(1-t)+(pb&255)*t);
  return `rgb(${r},${g},${bl})`;
}
function zColor(z){ // -2 .. 2 m
  const t = Math.max(0, Math.min(1, (z + 1.9) / 3.2));
  return t < .5 ? lerpHex('#3b6fd0','#2bb3a8', t*2) : lerpHex('#2bb3a8','#f0a040', (t-.5)*2);
}
function corners(o){
  const c = Math.cos(o.yaw||0), s = Math.sin(o.yaw||0), L = o.l/2, W = o.w/2;
  return [[L,W],[-L,W],[-L,-W],[L,-W]].map(([a,b]) => [o.x + a*c - b*s, o.y + a*s + b*c]);
}


/* ============================================================
   virtual KITTI-like scene (for illustration only)
   x = forward, y = left, sensor at origin
   ============================================================ */
const G = -1.73; // ground height relative to sensor
const ROI = {x0:0, x1:69.12, y0:-39.68, y1:39.68};
const FOV = Math.PI/4; // half angle of the camera view used here
const inFov = (x, y) => x > 0 && Math.abs(Math.atan2(y, x)) < FOV;
const OBJS = [
  {x:12.52, y:3.30, yaw:0.20, l:4.10, w:1.70, h:1.60, cls:'Car'},
  {x:22, y:-4.2, yaw:0, l:3.9, w:1.6, h:1.5, cls:'Car'},
  {x:31, y:6.5, yaw:3.14, l:4.2, w:1.7, h:1.5, cls:'Car'},
  {x:44, y:-7.5, yaw:0.05, l:4.0, w:1.7, h:1.5, cls:'Car'},
  {x:38, y:12.5, yaw:1.57, l:4.3, w:1.8, h:1.5, cls:'Car'},
  {x:56, y:3, yaw:3.10, l:4.0, w:1.7, h:1.5, cls:'Car'},
  {x:9, y:-3.6, yaw:1.4, l:0.8, w:0.6, h:1.73, cls:'Pedestrian'},
  {x:9.9, y:-4.4, yaw:1.6, l:0.8, w:0.6, h:1.73, cls:'Pedestrian'},
  {x:26, y:10.6, yaw:-1.5, l:0.8, w:0.6, h:1.73, cls:'Pedestrian'},
  {x:17, y:7.6, yaw:0.1, l:1.76, w:0.6, h:1.73, cls:'Cyclist'},
  {x:34, y:-12.2, yaw:-0.1, l:1.76, w:0.6, h:1.73, cls:'Cyclist'},
  {x:-7, y:3, yaw:0, l:4.2, w:1.7, h:1.5, cls:'Car', behind:true}
];
const KO = {Car:'차', Pedestrian:'보행자', Cyclist:'자전거'};
const POINTS = (function(){
  const r = rng(7), pts = [];
  for (let i = 0; i < 40; i++){
    const rad = 2.8 * Math.pow(1.085, i);
    if (rad > 75) break;
    const n = 1400;
    for (let k = 0; k < n; k++){
      if (r() < .45) continue;
      const a = (k / n) * Math.PI * 2 + r()*0.002;
      const x = rad*Math.cos(a), y = rad*Math.sin(a);
      if (Math.abs(y) > 16 || x < -14 || x > 72) continue;
      pts.push([x, y, G + gauss(r)*0.04, 1]);
    }
  }
  for (const wy of [16, -16]){
    for (let x = -14; x < 72; x += 0.16){
      const d = Math.hypot(x, wy);
      if (r() > 22/d) continue;
      for (let z = G; z < G + 4; z += 0.3 + r()*0.2) pts.push([x + gauss(r)*0.03, wy + gauss(r)*0.05, z, 2]);
    }
  }
  for (const [px,py] of [[-4,14.5],[14,14.6],[29,-14.6],[48,14.4],[62,-14.5],[5,-14.5]]){
    for (let k = 0; k < 70; k++) pts.push([px + gauss(r)*0.5, py + gauss(r)*0.5, G + 1.5 + r()*3, 2]);
  }
  for (const o of OBJS){
    const dist = Math.hypot(o.x, o.y);
    const n = Math.max(12, Math.min(460, 2800/(dist+2) * Math.sqrt((o.l*o.w)/7 + .2)));
    const c = Math.cos(o.yaw), s = Math.sin(o.yaw);
    const edges = [[[o.l/2,-o.w/2],[o.l/2,o.w/2],[1,0]],[[-o.l/2,-o.w/2],[-o.l/2,o.w/2],[-1,0]],[[-o.l/2,o.w/2],[o.l/2,o.w/2],[0,1]],[[-o.l/2,-o.w/2],[o.l/2,-o.w/2],[0,-1]]];
    const lens = edges.map(e => Math.hypot(e[1][0]-e[0][0], e[1][1]-e[0][1]));
    const tot = lens.reduce((a,b)=>a+b,0);
    let made = 0, guard = 0;
    while (made < n && guard++ < n*6){
      let t = r()*tot, ei = 0;
      while (t > lens[ei]) { t -= lens[ei]; ei++; }
      const e = edges[ei], f = t / lens[ei];
      const lx = e[0][0] + (e[1][0]-e[0][0])*f, ly = e[0][1] + (e[1][1]-e[0][1])*f;
      const wx = o.x + lx*c - ly*s, wy = o.y + lx*s + ly*c;
      const nx = e[2][0]*c - e[2][1]*s, ny = e[2][0]*s + e[2][1]*c;
      if (nx*wx + ny*wy > 0) continue;
      pts.push([wx + gauss(r)*0.02, wy + gauss(r)*0.02, G + r()*o.h, 3]);
      made++;
    }
  }
  return pts;
})();

// map world (x forward, y left) to canvas: x -> right, y -> up
function mapper(w, h, x0, x1, y0, y1, pad=0){
  const sc = Math.min((w - 2*pad)/(x1 - x0), (h - 2*pad)/(y1 - y0));
  const ox = (w - (x1 - x0)*sc)/2, oy = (h - (y1 - y0)*sc)/2;
  return {sc, X: x => ox + (x - x0)*sc, Y: y => oy + (y1 - y)*sc};
}
function drawPts(ctx, m, w, h, opts={}){
  for (const p of POINTS){
    const X = m.X(p[0]), Y = m.Y(p[1]);
    if (X < 0 || Y < 0 || X > w || Y > h) continue;
    let a = p[3] === 1 ? .38 : .95;
    if (opts.fov && !inFov(p[0], p[1])) a *= .15;
    ctx.globalAlpha = a * (opts.alpha || 1);
    ctx.fillStyle = zColor(p[2] + 0.1);
    const s = (p[3] === 3 ? 2.4 : 1.2) * (opts.size || 1);
    ctx.fillRect(X - s/2, Y - s/2, s, s);
  }
  ctx.globalAlpha = 1;
}
function drawEgo(ctx, m){
  const X = m.X(0), Y = m.Y(0);
  ctx.fillStyle = tok('--ink');
  ctx.beginPath(); ctx.moveTo(X+8, Y); ctx.lineTo(X-6, Y-6); ctx.lineTo(X-6, Y+6); ctx.closePath(); ctx.fill();
}
function strokeBoxM(ctx, o, m, color, lw=1.5, heading=true){
  const cs = corners(o).map(([x,y]) => [m.X(x), m.Y(y)]);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); cs.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.stroke();
  if (heading){
    ctx.beginPath(); ctx.moveTo((cs[0][0]+cs[3][0])/2, (cs[0][1]+cs[3][1])/2); ctx.lineTo(m.X(o.x), m.Y(o.y)); ctx.stroke();
  }
}
function safeHex(n, fb){ const v = tok(n); return v.startsWith('#') ? v : fb; }

// anchor grid (feature map 216 x 248)
const ANCH = {nx:216, ny:248, sx:69.12/215, sy:79.36/247};
const anchorX = col => col*ANCH.sx, anchorY = row => -39.68 + row*ANCH.sy;
const ANCHOR_T = [
  {l:3.9, w:1.6, yaw:0, cls:'Car', c:'--teal'}, {l:3.9, w:1.6, yaw:Math.PI/2, cls:'Car', c:'--teal'},
  {l:0.8, w:0.6, yaw:0, cls:'Pedestrian', c:'--violet'}, {l:0.8, w:0.6, yaw:Math.PI/2, cls:'Pedestrian', c:'--violet'},
  {l:1.76, w:0.6, yaw:0, cls:'Cyclist', c:'--heat'}, {l:1.76, w:0.6, yaw:Math.PI/2, cls:'Cyclist', c:'--heat'}
];
// nearest-BEV axis-aligned IoU (OpenPCDet AxisAlignedTargetAssigner)
function nearestAA(o){
  const r = Math.abs(((o.yaw % Math.PI) + Math.PI) % Math.PI);
  const swap = r > Math.PI/4 && r < 3*Math.PI/4;
  return {x:o.x, y:o.y, dx: swap ? o.w : o.l, dy: swap ? o.l : o.w};
}
function iouAA(a, b){
  const iw = Math.max(0, Math.min(a.x + a.dx/2, b.x + b.dx/2) - Math.max(a.x - a.dx/2, b.x - b.dx/2));
  const ih = Math.max(0, Math.min(a.y + a.dy/2, b.y + b.dy/2) - Math.max(a.y - a.dy/2, b.y - b.dy/2));
  const I = iw*ih; return I / (a.dx*a.dy + b.dx*b.dy - I);
}
// rotated IoU for NMS
function polyArea(p){ let a = 0; for (let i = 0; i < p.length; i++){ const [x1,y1] = p[i], [x2,y2] = p[(i+1)%p.length]; a += x1*y2 - x2*y1; } return Math.abs(a)/2; }
function clip(subj, clipP){
  let out = subj;
  for (let i = 0; i < clipP.length; i++){
    const A = clipP[i], B = clipP[(i+1)%clipP.length], inp = out; out = [];
    if (!inp.length) break;
    const side = P => (B[0]-A[0])*(P[1]-A[1]) - (B[1]-A[1])*(P[0]-A[0]);
    for (let j = 0; j < inp.length; j++){
      const P = inp[j], Q = inp[(j+1)%inp.length], sp = side(P), sq = side(Q);
      if (sp >= 0) out.push(P);
      if ((sp >= 0) !== (sq >= 0)){ const t = sp/(sp - sq); out.push([P[0] + (Q[0]-P[0])*t, P[1] + (Q[1]-P[1])*t]); }
    }
  }
  return out;
}
function iouRot(a, b){
  const ccw = p => { let s = 0; for (let i = 0; i < p.length; i++){ const [x1,y1] = p[i], [x2,y2] = p[(i+1)%p.length]; s += x1*y2 - x2*y1; } return s > 0 ? p : p.slice().reverse(); };
  const inter = clip(ccw(corners(a)), ccw(corners(b)));
  const I = inter.length > 2 ? polyArea(inter) : 0;
  return I / (a.l*a.w + b.l*b.w - I);
}
/* ============================================================
   slide engine
   ============================================================ */
const slides = $$('.slide');
const STAGES = [['input','입력'],['pillar','Pillar화'],['pfn','PFN'],['scatter','Scatter'],['backbone','2D 백본'],['head','Anchor·Head'],['train','학습'],['post','후처리'],['deploy','Orin 배포']];
const hooks = {};
const inited = new Set();
let cur = 0, step = 0;

const pmap = $('#pmap');
STAGES.forEach(([k,l]) => { const s = document.createElement('span'); s.dataset.k = k; s.textContent = l; pmap.appendChild(s); });

const tocList = $('#toc-list');
slides.forEach((s,i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<span>${i+1}</span>${s.dataset.title}`;
  b.addEventListener('click', () => { go(i, 0); togglePanel('toc', false); });
  li.appendChild(b); tocList.appendChild(li);
});

function nSteps(i){ return +slides[i].dataset.steps || 1; }
function applyStep(){
  const s = slides[cur];
  $$('.frag', s).forEach(f => {
    const a = +f.dataset.s, u = f.dataset.u;
    f.classList.toggle('on', step >= a && (u === undefined || step < +u));
  });
  const h = hooks[s.id];
  if (h && h.step) h.step(step);
  updateUI();
}
function go(i, k){
  if (i !== cur){
    const h = hooks[slides[cur].id]; if (h && h.leave) h.leave();
    slides[cur].classList.remove('active');
    cur = i;
  }
  slides[cur].classList.add('active');
  const id = slides[cur].id;
  if (!inited.has(id)){ inited.add(id); const h = hooks[id]; if (h && h.init) h.init(); }
  step = Math.max(0, Math.min(k, nSteps(cur)-1));
  applyStep();
  try { history.replaceState(null, '', '#' + id); } catch(e) {}
}
function next(){ if (step < nSteps(cur)-1){ step++; applyStep(); } else if (cur < slides.length-1) go(cur+1, 0); }
function prev(){ if (step > 0){ step--; applyStep(); } else if (cur > 0) go(cur-1, nSteps(cur-1)-1); }

function updateUI(){
  const s = slides[cur], st = s.dataset.stage;
  const idx = STAGES.findIndex(x => x[0] === st);
  $$('span', pmap).forEach((e,i) => { e.classList.toggle('here', i === idx); e.classList.toggle('done', idx >= 0 && i < idx); });
  const here = $('span.here', pmap); if (here) here.scrollIntoView({block:'nearest', inline:'nearest'});
  $('#counter').textContent = `${cur+1} / ${slides.length}`;
  const dots = $('#dots'); dots.innerHTML = '';
  for (let i = 0; i < nSteps(cur); i++){ const d = document.createElement('i'); if (i <= step) d.className = 'on'; dots.appendChild(d); }
  $('#progbar').style.width = ((cur + (step+1)/nSteps(cur)) / slides.length * 100) + '%';
  const n = $('.notes', s);
  $('#notes-body').innerHTML = `<h3 style="margin-top:6px">${cur+1}. ${s.dataset.title}</h3>` + (n ? n.innerHTML : '<p class="muted">이 슬라이드에는 노트가 없습니다.</p>');
  $$('#toc-list button').forEach((b,i) => b.classList.toggle('cur', i === cur));
}
function togglePanel(id, force){
  const p = $('#'+id); const open = force === undefined ? !p.classList.contains('open') : force;
  p.classList.toggle('open', open);
  if (open){ const other = id === 'notes' ? 'toc' : 'notes'; $('#'+other).classList.remove('open'); }
}

$('#next').addEventListener('click', e => { e.stopPropagation(); next(); });
$('#prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
$('#notes-btn').addEventListener('click', () => togglePanel('notes'));
$('#toc-btn').addEventListener('click', () => togglePanel('toc'));
$('#notes-close').addEventListener('click', () => togglePanel('notes', false));
$('#toc-close').addEventListener('click', () => togglePanel('toc', false));
$('#stage').addEventListener('click', e => {
  if (e.target.closest('button, a, input, select, .panel, table, .btnrow')) return;
  if (window.getSelection && String(window.getSelection())) return;
  next();
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter'){ if (k === 'Enter' && e.target.closest('button')) return; e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'Home'){ go(0,0); }
  else if (k === 'End'){ go(slides.length-1, 0); }
  else if (k === 'n' || k === 'N'){ togglePanel('notes'); }
  else if (k === 't' || k === 'T'){ togglePanel('toc'); }
  else if (k === 'Escape'){ togglePanel('notes', false); togglePanel('toc', false); }
});

// theme
$('#themebtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('pp-theme', root.dataset.theme); } catch(e) {}
  redraw();
});
try { const t = localStorage.getItem('pp-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => redraw());
function redraw(){ const h = hooks[slides[cur].id]; if (h && h.step) h.step(step); }

// scaling
const stage = $('#stage'), vp = $('#viewport');
function fit(){
  const flow = window.innerWidth < 760;
  document.body.classList.toggle('flow', flow);
  if (flow){ stage.style.transform = ''; stage.style.position = ''; stage.style.left = ''; stage.style.top = ''; }
  else {
    const r = vp.getBoundingClientRect();
    const s = Math.min((r.width - 8) / 1280, (r.height - 16) / 720);
    stage.style.position = 'absolute'; stage.style.left = '50%'; stage.style.top = '50%';
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  redraw();
}
window.addEventListener('resize', fit);

/* ============================================================
   S1 title: forward LiDAR scan
   ============================================================ */
hooks.s1 = (function(){
  let raf = 0, t0 = 0;
  function frame(t){
    const c = $('#cv-title'), P = prep(c); if (!P) return;
    const {ctx, w, h} = P;
    const m = mapper(w, h, -6, 62, -26, 26);
    const ang = reduced ? null : ((t - t0) / 2600) * Math.PI * 2;
    ctx.fillStyle = tok('--panel'); ctx.fillRect(0,0,w,h);
    // FOV wedge
    const ex = m.X(0), ey = m.Y(0), R = 80*m.sc;
    ctx.fillStyle = hexA(safeHex('--heat','#c0650f'), .06);
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.arc(ex, ey, R, -FOV, FOV); ctx.closePath(); ctx.fill();
    for (const p of POINTS){
      const X = m.X(p[0]), Y = m.Y(p[1]);
      if (X < 0 || Y < 0 || X > w || Y > h) continue;
      let a = 1;
      if (ang !== null){
        let d = (ang - Math.atan2(p[1], p[0])) % (Math.PI*2); if (d < 0) d += Math.PI*2;
        a = Math.max(.12, 1 - d / (Math.PI*2));
      }
      ctx.globalAlpha = a * (p[3] === 1 ? .55 : .95) * (inFov(p[0], p[1]) ? 1 : .35);
      ctx.fillStyle = zColor(p[2] + 0.1);
      ctx.fillRect(X-.8, Y-.8, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
    if (ang !== null){
      ctx.strokeStyle = hexA(safeHex('--heat','#c0650f'), .5); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex + Math.cos(ang)*w*2, ey - Math.sin(ang)*w*2); ctx.stroke();
    }
    drawEgo(ctx, m);
    const g = ctx.createLinearGradient(0,0,w*0.3,0);
    g.addColorStop(0, tok('--panel')); g.addColorStop(1, hexA(safeHex('--panel','#ffffff'), 0));
    ctx.fillStyle = g; ctx.fillRect(0,0,w*0.3,h);
    if (!reduced && slides[cur].id === 's1') raf = requestAnimationFrame(frame);
  }
  return {
    step(){ cancelAnimationFrame(raf); t0 = performance.now(); raf = requestAnimationFrame(frame); },
    leave(){ cancelAnimationFrame(raf); }
  };
})();

/* ============================================================
   S2 problem + input: KITTI ROI and FOV
   ============================================================ */
hooks.s2 = {
  step(k){
    const P = prep($('#cv-s2')); if (!P) return;
    const {ctx, w, h} = P;
    ctx.fillStyle = tok('--bg'); ctx.fillRect(0,0,w,h);
    const m = mapper(w, h, -14, 72, -20, 20, 8);
    drawPts(ctx, m, w, h, {fov: k >= 1});
    drawEgo(ctx, m);
    ctx.font = '12px ' + tok('--sans');
    if (k >= 1){
      const heat = tok('--heat');
      ctx.strokeStyle = heat; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
      ctx.strokeRect(m.X(ROI.x0), m.Y(Math.min(ROI.y1, 20)), (ROI.x1 - ROI.x0)*m.sc, (Math.min(ROI.y1,20) - Math.max(ROI.y0,-20))*m.sc);
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(m.X(0), m.Y(0)); ctx.lineTo(m.X(20), m.Y(20)); ctx.moveTo(m.X(0), m.Y(0)); ctx.lineTo(m.X(20), m.Y(-20)); ctx.stroke();
      ctx.fillStyle = heat;
      ctx.fillText('카메라 시야 (앞쪽 부채꼴)', m.X(24), m.Y(-17));
      ctx.fillText('x = 69.12 m', m.X(69.12) - 72, m.Y(0) - 8);
      ctx.fillStyle = tok('--muted');
      ctx.fillText('뒤쪽·옆쪽 점은 버린다', m.X(-13), m.Y(-18));
    }
    if (k >= 2){
      ctx.setLineDash([3,4]); ctx.strokeStyle = tok('--muted'); ctx.lineWidth = 1;
      for (const r of [10, 40]){ ctx.beginPath(); ctx.arc(m.X(0), m.Y(0), r*m.sc, -FOV, FOV); ctx.stroke(); }

    }

      for (const o of OBJS){ if (o.behind) continue; strokeBoxM(ctx, o, m, tok('--ink'), 1.4); }

      const seen = new Set();

hooks.s16 = {
  step(k){
    const P = prep($('#cv-s16')); if (!P) return;
    const {ctx, w, h} = P;
    ctx.fillStyle = tok('--bg'); ctx.fillRect(0,0,w,h);
    const m = mapper(w, h, 9.4, 15.6, 0.9, 5.7, 10);
    drawPts(ctx, m, w, h, {size:2, alpha:.6});
    const car = OBJS[0], gt = nearestAA(car);
    strokeBoxM(ctx, car, m, tok('--ink'), 2.2, true);
    const c0 = Math.floor(9.4/ANCH.sx), c1 = Math.ceil(15.6/ANCH.sx), r0 = Math.floor((0.9+39.68)/ANCH.sy), r1 = Math.ceil((5.7+39.68)/ANCH.sy);
    if (k === 1){
      const a = {x:anchorX(38), y:anchorY(133), dx:3.9, dy:1.6};
      ctx.fillStyle = hexA(safeHex('--heat','#c0650f'), .3);
      const ix0 = Math.max(a.x - a.dx/2, gt.x - gt.dx/2), ix1 = Math.min(a.x + a.dx/2, gt.x + gt.dx/2), iy0 = Math.max(a.y - a.dy/2, gt.y - gt.dy/2), iy1 = Math.min(a.y + a.dy/2, gt.y + gt.dy/2);
      ctx.fillRect(m.X(ix0), m.Y(iy1), (ix1 - ix0)*m.sc, (iy1 - iy0)*m.sc);
      ctx.setLineDash([6,4]); strokeBoxM(ctx, {x:a.x, y:a.y, l:3.9, w:1.6, yaw:0}, m, tok('--heat'), 2, false); ctx.setLineDash([]);
      ctx.font = '600 12px ' + tok('--sans'); ctx.fillStyle = tok('--ink');
      ctx.fillText(`IoU = 겹친 넓이 / 합친 넓이 = ${iouAA(a, gt).toFixed(3)}`, 12, 20);
    }
    if (k >= 2){
      const rows = [[38,133],[38,134],[39,133],[37,133]];
      for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++){
        const ax = anchorX(c), ay = anchorY(r);
        const i0 = iouAA({x:ax, y:ay, dx:3.9, dy:1.6}, gt), i9 = iouAA({x:ax, y:ay, dx:1.6, dy:3.9}, gt), v = Math.max(i0, i9);
        let col = tok('--line'), rad = 2.4;
        if (k >= 3){ if (v >= 0.6){ col = tok('--heat'); rad = 4.5; } else if (v >= 0.45){ col = tok('--violet'); rad = 3.6; } }
        const isRow = rows.some(([a,b]) => a === c && b === r);
        if (k === 2 && isRow){ col = tok('--heat'); rad = 4.5; }
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(m.X(ax), m.Y(ay), rad, 0, Math.PI*2); ctx.fill();
      }
      if (k === 2){
        ctx.font = '11px ' + tok('--mono'); ctx.fillStyle = tok('--ink');
        rows.forEach(([c, r]) => ctx.fillText(`(${c},${r})`, m.X(anchorX(c)) + 6, m.Y(anchorY(r)) - 6));
      }
      if (k >= 3){
        let np = 0, ni = 0;
        for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++){ const ax = anchorX(c), ay = anchorY(r), v = iouAA({x:ax, y:ay, dx:3.9, dy:1.6}, gt); if (v >= 0.6) np++; else if (v >= 0.45) ni++; }
        ctx.font = '600 12px ' + tok('--sans'); ctx.fillStyle = tok('--ink');
        ctx.fillText(`이 차의 양성 anchor ${np}개 · 무시 ${ni}개 · 나머지는 모두 음성`, 12, 20);
      }
    }
  }
};

/* ============================================================
   S18 postprocess: candidates, decode, class-agnostic rotated NMS 0.01
   ============================================================ */
const CANDS = (function(){
  const r = rng(99), out = [];
  OBJS.forEach(o => {
    if (o.behind || o.x > 60) return;
    const n = o.cls === 'Car' ? 6 : 4;
    for (let i = 0; i < n; i++){
      const score = Math.max(0.12, (o.cls === 'Car' ? 0.92 : 0.78) - i*0.11 - r()*0.05);
      out.push({x:o.x + gauss(r)*0.2, y:o.y + gauss(r)*0.2, yaw:o.yaw + gauss(r)*0.05, l:o.l*(1 + gauss(r)*0.05), w:o.w*(1 + gauss(r)*0.05), cls:o.cls, score});
    }
  });
  // a cyclist that is also scored as a pedestrian (class-agnostic NMS removes the weaker one)
  const cy = OBJS.find(o => o.cls === 'Cyclist');
  out.push({x:cy.x + 0.1, y:cy.y - 0.05, yaw:cy.yaw, l:0.8, w:0.6, cls:'Pedestrian', score:0.31});
  // a low-score false positive in empty space
  out.push({x:47, y:9, yaw:0.3, l:3.8, w:1.6, cls:'Car', score:0.14});
  out.sort((a,b) => b.score - a.score);
  const dead = new Set();
  out.forEach((c,i) => { if (dead.has(i)) return; for (let j = i+1; j < out.length; j++) if (!dead.has(j) && iouRot(c, out[j]) >= 0.01) dead.add(j); });
  out.forEach((c,i) => c.keep = !dead.has(i));
  return out;
})();
hooks.s18 = (function(){
  let raf = 0, t0 = 0;
  function draw(k, t){
    const P = prep($('#cv-s18')); if (!P) return;
    const {ctx, w, h} = P;
    ctx.fillStyle = tok('--bg'); ctx.fillRect(0,0,w,h);
    const m = mapper(w, h, 0, 60, -16, 16, 8);
    drawPts(ctx, m, w, h, {alpha:.5, fov:true});
    const heat = tok('--heat'), rose = tok('--rose'), ink = tok('--ink');
    if (k === 1){ for (const c of CANDS){ ctx.fillStyle = heat; ctx.globalAlpha = .4 + .6*c.score; ctx.beginPath(); ctx.arc(m.X(c.x), m.Y(c.y), 3, 0, Math.PI*2); ctx.fill(); } ctx.globalAlpha = 1; }
    if (k === 2){ for (const c of CANDS){ ctx.globalAlpha = .3 + .6*c.score; strokeBoxM(ctx, c, m, heat, 1.2, false); } ctx.globalAlpha = 1; }
    if (k === 3){
      const e = reduced ? 1 : Math.min(1, (t - t0)/1600);
      for (const c of CANDS){
        if (c.keep){ strokeBoxM(ctx, c, m, heat, 2, true); continue; }
        ctx.globalAlpha = e < .5 ? .9 : Math.max(0, 1 - (e - .5)*2); strokeBoxM(ctx, c, m, rose, 1.4, false);
      }
      ctx.globalAlpha = 1;
      if (e < 1) raf = requestAnimationFrame(tt => draw(k, tt));
    }
    if (k >= 4){
      ctx.font = '11px ' + tok('--sans');
      for (const c of CANDS){ if (!c.keep) continue; strokeBoxM(ctx, c, m, heat, 2, true); ctx.fillStyle = ink; ctx.fillText(`${KO[c.cls]} ${c.score.toFixed(2)}`, m.X(c.x) + 6, m.Y(c.y) - Math.max(c.l, c.w)*m.sc/2 - 3); }
    }
    drawEgo(ctx, m);
    ctx.font = '12px ' + tok('--sans'); ctx.fillStyle = tok('--muted');
    const nk = CANDS.filter(c => c.keep).length;
    const msg = ['', `점수 ≥ 0.1인 anchor ${CANDS.length}개`, `후보 박스 ${CANDS.length}개 (한 물체에 여러 개)`, `NMS: ${CANDS.length - nk}개 제거 (자전거 위 "보행자" 후보 포함)`, `최종 ${nk}개 · 빈 곳의 0.14짜리도 남는다`, `최종 ${nk}개`][k] || '';
    ctx.fillText(msg, 12, 20);
  }
  return {
    step(k){ cancelAnimationFrame(raf); t0 = performance.now(); draw(k, t0); },
    leave(){ cancelAnimationFrame(raf); }
  };
})();

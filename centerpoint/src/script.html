<script>
(function(){
"use strict";
/* ============================================================
   helpers
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
function S(tag, attrs, parent, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r){ let u = 0, v = 0; while(!u) u = r(); while(!v) v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function prep(c){
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return null;
  const d = 2;
  if (c.width !== w*d || c.height !== h*d){ c.width = w*d; c.height = h*d; }
  const ctx = c.getContext('2d');
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, w, h};
}
function hexA(hex, a){
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(x=>x+x).join('');
  const n = parseInt(hex,16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
function lerpHex(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round((pa>>16&255)*(1-t)+(pb>>16&255)*t), g = Math.round((pa>>8&255)*(1-t)+(pb>>8&255)*t), bl = Math.round((pa&255)*(1-t)+(pb&255)*t);
  return `rgb(${r},${g},${bl})`;
}
function zColor(z){ // -2 .. 2 m
  const t = Math.max(0, Math.min(1, (z + 1.9) / 3.2));
  return t < .5 ? lerpHex('#3b6fd0','#2bb3a8', t*2) : lerpHex('#2bb3a8','#f0a040', (t-.5)*2);
}
function corners(o){
  const c = Math.cos(o.yaw||0), s = Math.sin(o.yaw||0), L = o.l/2, W = o.w/2;
  return [[L,W],[-L,W],[-L,-W],[L,-W]].map(([a,b]) => [o.x + a*c - b*s, o.y + a*s + b*c]);
}

/* ============================================================
   virtual scene (for illustration only)
   ============================================================ */
const G = -1.8; // ground height relative to sensor
const OBJS = [
  {x:12.22, y:3.37, yaw:0.524, w:1.94, l:4.62, h:1.54, cls:'승용차', task:0, v:[3.2,0.4]},
  {x:-8, y:6.5, yaw:0, w:1.9, l:4.5, h:1.5, cls:'승용차', task:0, v:[0,0]},
  {x:20, y:-9, yaw:1.57, w:2.0, l:4.8, h:1.6, cls:'승용차', task:0, v:[0,-5]},
  {x:-16, y:-4, yaw:0.1, w:1.8, l:4.3, h:1.5, cls:'승용차', task:0, v:[6,0.6]},
  {x:-30, y:-12, yaw:0.05, w:1.9, l:4.6, h:1.5, cls:'승용차', task:0, v:[0,0]},
  {x:33, y:8, yaw:-0.3, w:1.9, l:4.5, h:1.5, cls:'승용차', task:0, v:[-7,2]},
  {x:6, y:-19, yaw:0, w:2.9, l:11, h:3.2, cls:'버스', task:2, v:[4,0]},
  {x:-25, y:16, yaw:0.2, w:2.5, l:7, h:3, cls:'트럭', task:1, v:[0,0]},
  {x:6, y:9, yaw:0, w:0.7, l:0.7, h:1.7, cls:'보행자', task:5, v:[0,1.2]},
  {x:7.2, y:10, yaw:0, w:0.7, l:0.7, h:1.7, cls:'보행자', task:5, v:[0,1.1]},
  {x:-4, y:-9.5, yaw:0, w:0.7, l:0.7, h:1.7, cls:'보행자', task:5, v:[1,0]},
  {x:3, y:-5, yaw:0, w:0.4, l:0.4, h:0.7, cls:'콘', task:5, v:[0,0]},
  {x:3.6, y:-6.2, yaw:0, w:0.4, l:0.4, h:0.7, cls:'콘', task:5, v:[0,0]},
  {x:4.2, y:-7.4, yaw:0, w:0.4, l:0.4, h:0.7, cls:'콘', task:5, v:[0,0]},
  {x:-12, y:12, yaw:0.3, w:0.6, l:1.8, h:1.4, cls:'자전거', task:4, v:[2,0.6]},
  ...[0,1,2,3,4].map(i => ({x:-2+i*2.2, y:14, yaw:0, w:0.5, l:2, h:1, cls:'방호벽', task:3, v:[0,0]}))
];
const POINTS = (function(){
  const r = rng(7), pts = [];
  for (let i = 0; i < 34; i++){
    const rad = 2.4 * Math.pow(1.1, i);
    if (rad > 54) break;
    const n = 1100;
    for (let k = 0; k < n; k++){
      if (r() < .45) continue;
      const a = (k / n) * Math.PI * 2 + r()*0.002;
      const x = rad*Math.cos(a), y = rad*Math.sin(a);
      if (Math.abs(y) > 24) continue;
      pts.push([x, y, G + gauss(r)*0.04, 1]);
    }
  }
  // building walls at |y| = 24
  for (const wy of [24, -24]){
    for (let x = -50; x < 50; x += 0.18){
      const d = Math.hypot(x, wy);
      if (r() > 30/d) continue;
      for (let z = G; z < G + 5; z += 0.35 + r()*0.2) pts.push([x + gauss(r)*0.03, wy + gauss(r)*0.05, z, 2]);
    }
  }
  // poles / trees
  for (const [px,py] of [[-20,21],[0,21.5],[18,-21],[28,20],[-38,-21],[40,-20]]){
    for (let k = 0; k < 60; k++) pts.push([px + gauss(r)*0.6, py + gauss(r)*0.6, G + 1.5 + r()*3, 2]);
  }
  // objects: visible faces only
  for (const o of OBJS){
    const dist = Math.hypot(o.x, o.y);
    const n = Math.max(10, Math.min(420, 2600/(dist+2) * Math.sqrt((o.l*o.w)/8 + .15)));
    const c = Math.cos(o.yaw), s = Math.sin(o.yaw);
    const edges = [[[o.l/2,-o.w/2],[o.l/2,o.w/2],[1,0]],[[-o.l/2,-o.w/2],[-o.l/2,o.w/2],[-1,0]],[[-o.l/2,o.w/2],[o.l/2,o.w/2],[0,1]],[[-o.l/2,-o.w/2],[o.l/2,-o.w/2],[0,-1]]];
    const lens = edges.map(e => Math.hypot(e[1][0]-e[0][0], e[1][1]-e[0][1]));
    const tot = lens.reduce((a,b)=>a+b,0);
    let made = 0, guard = 0;
    while (made < n && guard++ < n*6){
      let t = r()*tot, ei = 0;
      while (t > lens[ei]) { t -= lens[ei]; ei++; }
      const e = edges[ei], f = t / lens[ei];
      const lx = e[0][0] + (e[1][0]-e[0][0])*f, ly = e[0][1] + (e[1][1]-e[0][1])*f;
      const wx = o.x + lx*c - ly*s, wy = o.y + lx*s + ly*c;
      const nx = e[2][0]*c - e[2][1]*s, ny = e[2][0]*s + e[2][1]*c;
      if (nx*wx + ny*wy > 0) continue;
      pts.push([wx + gauss(r)*0.02, wy + gauss(r)*0.02, G + r()*o.h, 3]);
      made++;
    }
  }
  return pts;
})();

function drawCloud(ctx, w, h, R, opts={}){
  const sc = Math.min(w, h) / (2*R), cx = w/2, cy = h/2;
  ctx.fillStyle = tok('--bg'); ctx.fillRect(0,0,w,h);
  for (const p of POINTS){
    const X = cx + p[0]*sc, Y = cy - p[1]*sc;
    if (X < 0 || Y < 0 || X > w || Y > h) continue;
    ctx.globalAlpha = p[3] === 1 ? .38 : .95;
    ctx.fillStyle = zColor(p[2]);
    const s = p[3] === 3 ? 2.4 : 1.2;
    ctx.fillRect(X - s/2, Y - s/2, s, s);
  }
  ctx.globalAlpha = 1;
  // ego
  ctx.fillStyle = tok('--ink');
  ctx.beginPath(); ctx.moveTo(cx+7, cy); ctx.lineTo(cx-5, cy-5); ctx.lineTo(cx-5, cy+5); ctx.closePath(); ctx.fill();
  return {sc, cx, cy};
}
function strokeBox(ctx, o, m, color, lw=1.5, heading=true){
  const cs = corners(o).map(([x,y]) => [m.cx + x*m.sc, m.cy - y*m.sc]);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); cs.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.stroke();
  if (heading){
    ctx.beginPath(); ctx.moveTo((cs[0][0]+cs[3][0])/2, (cs[0][1]+cs[3][1])/2); ctx.lineTo(m.cx + o.x*m.sc, m.cy - o.y*m.sc); ctx.stroke();
  }
}

/* ============================================================
   slide engine
   ============================================================ */
const slides = $$('.slide');
const STAGES = [['input','입력'],['voxel','복셀화'],['sparse','3D Sparse 백본'],['bev','BEV'],['neck','Neck'],['head','Head'],['train','학습'],['post','후처리'],['deploy','Orin 배포']];
const hooks = {};
const inited = new Set();
let cur = 0, step = 0;

const pmap = $('#pmap');
STAGES.forEach(([k,l]) => { const s = document.createElement('span'); s.dataset.k = k; s.textContent = l; pmap.appendChild(s); });

const tocList = $('#toc-list');
slides.forEach((s,i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<span>${i+1}</span>${s.dataset.title}`;
  b.addEventListener('click', () => { go(i, 0); togglePanel('toc', false); });
  li.appendChild(b); tocList.appendChild(li);
});

function nSteps(i){ return +slides[i].dataset.steps || 1; }
function applyStep(){
  const s = slides[cur];
  $$('.frag', s).forEach(f => {
    const a = +f.dataset.s, u = f.dataset.u;
    f.classList.toggle('on', step >= a && (u === undefined || step < +u));
  });
  const h = hooks[s.id];
  if (h && h.step) h.step(step);
  updateUI();
}
function go(i, k){
  if (i !== cur){
    const h = hooks[slides[cur].id]; if (h && h.leave) h.leave();
    slides[cur].classList.remove('active');
    cur = i;
  }
  slides[cur].classList.add('active');
  const id = slides[cur].id;
  if (!inited.has(id)){ inited.add(id); const h = hooks[id]; if (h && h.init) h.init(); }
  step = Math.max(0, Math.min(k, nSteps(cur)-1));
  applyStep();
  try { history.replaceState(null, '', '#' + id); } catch(e) {}
}
function next(){ if (step < nSteps(cur)-1){ step++; applyStep(); } else if (cur < slides.length-1) go(cur+1, 0); }
function prev(){ if (step > 0){ step--; applyStep(); } else if (cur > 0) go(cur-1, nSteps(cur-1)-1); }

function updateUI(){
  const s = slides[cur], st = s.dataset.stage;
  const idx = STAGES.findIndex(x => x[0] === st);
  $$('span', pmap).forEach((e,i) => { e.classList.toggle('here', i === idx); e.classList.toggle('done', idx >= 0 && i < idx); });
  const here = $('span.here', pmap); if (here) here.scrollIntoView({block:'nearest', inline:'nearest'});
  $('#counter').textContent = `${cur+1} / ${slides.length}`;
  const dots = $('#dots'); dots.innerHTML = '';
  for (let i = 0; i < nSteps(cur); i++){ const d = document.createElement('i'); if (i <= step) d.className = 'on'; dots.appendChild(d); }
  $('#progbar').style.width = ((cur + (step+1)/nSteps(cur)) / slides.length * 100) + '%';
  const n = $('.notes', s);
  $('#notes-body').innerHTML = `<h3 style="margin-top:6px">${cur+1}. ${s.dataset.title}</h3>` + (n ? n.innerHTML : '<p class="muted">이 슬라이드에는 노트가 없습니다.</p>');
  $$('#toc-list button').forEach((b,i) => b.classList.toggle('cur', i === cur));
}
function togglePanel(id, force){
  const p = $('#'+id); const open = force === undefined ? !p.classList.contains('open') : force;
  p.classList.toggle('open', open);
  if (open){ const other = id === 'notes' ? 'toc' : 'notes'; $('#'+other).classList.remove('open'); }
}

$('#next').addEventListener('click', e => { e.stopPropagation(); next(); });
$('#prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
$('#notes-btn').addEventListener('click', () => togglePanel('notes'));
$('#toc-btn').addEventListener('click', () => togglePanel('toc'));
$('#notes-close').addEventListener('click', () => togglePanel('notes', false));
$('#toc-close').addEventListener('click', () => togglePanel('toc', false));
$('#stage').addEventListener('click', e => {
  if (e.target.closest('button, a, input, select, .panel, table, .btnrow')) return;
  if (window.getSelection && String(window.getSelection())) return;
  next();
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter'){ if (k === 'Enter' && e.target.closest('button')) return; e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'Home'){ go(0,0); }
  else if (k === 'End'){ go(slides.length-1, 0); }
  else if (k === 'n' || k === 'N'){ togglePanel('notes'); }
  else if (k === 't' || k === 'T'){ togglePanel('toc'); }
  else if (k === 'Escape'){ togglePanel('notes', false); togglePanel('toc', false); }
});

// theme
$('#themebtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('cp-theme', root.dataset.theme); } catch(e) {}
  redraw();
});
try { const t = localStorage.getItem('cp-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => redraw());
function redraw(){ const h = hooks[slides[cur].id]; if (h && h.step) h.step(step); }

// scaling
const stage = $('#stage'), vp = $('#viewport');
function fit(){
  const flow = window.innerWidth < 760;
  document.body.classList.toggle('flow', flow);
  if (flow){ stage.style.transform = ''; stage.style.position = ''; stage.style.left = ''; stage.style.top = ''; }
  else {
    const r = vp.getBoundingClientRect();
    const s = Math.min((r.width - 8) / 1280, (r.height - 16) / 720);
    stage.style.position = 'absolute'; stage.style.left = '50%'; stage.style.top = '50%';
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  redraw();
}
window.addEventListener('resize', fit);

/* ============================================================
   S1 title: rotating LiDAR scan
   ============================================================ */
hooks.s1 = (function(){
  let raf = 0, t0 = 0;
  function frame(t){
    const c = $('#cv-title'), P = prep(c); if (!P) return;
    const {ctx, w, h} = P;
    const R = 34, sc = Math.min(w, h) / (2*R) * 1.05, cx = w*0.55, cy = h/2;
    const ang = reduced ? null : ((t - t0) / 2600) * Math.PI * 2;
    ctx.fillStyle = tok('--panel'); ctx.fillRect(0,0,w,h);
    for (const p of POINTS){
      const X = cx + p[0]*sc, Y = cy - p[1]*sc;
      if (X < 0 || Y < 0 || X > w || Y > h) continue;
      let a = 1;
      if (ang !== null){
        let d = (ang - Math.atan2(p[1], p[0])) % (Math.PI*2); if (d < 0) d += Math.PI*2;
        a = Math.max(.12, 1 - d / (Math.PI*2));
      }
      ctx.globalAlpha = a * (p[3] === 1 ? .55 : .95);
      ctx.fillStyle = zColor(p[2]);
      ctx.fillRect(X-.8, Y-.8, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
    if (ang !== null){
      ctx.strokeStyle = hexA(tok('--heat'), .5); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang)*w, cy - Math.sin(ang)*w); ctx.stroke();
    }
    ctx.fillStyle = tok('--ink');
    ctx.beginPath(); ctx.moveTo(cx+8, cy); ctx.lineTo(cx-6, cy-6); ctx.lineTo(cx-6, cy+6); ctx.closePath(); ctx.fill();
    // fade toward text side
    const g = ctx.createLinearGradient(0,0,w*0.45,0);
    g.addColorStop(0, tok('--panel')); g.addColorStop(1, hexA(tok('--panel').startsWith('#') ? tok('--panel') : '#ffffff', 0));
    ctx.fillStyle = g; ctx.fillRect(0,0,w*0.45,h);
    if (!reduced && slides[cur].id === 's1') raf = requestAnimationFrame(frame);
  }
  return {
    step(){ cancelAnimationFrame(raf); t0 = performance.now(); raf = requestAnimationFrame(frame); },
    leave(){ cancelAnimationFrame(raf); }
  };
})();

/* ============================================================
   S2 problem: static cloud + boxes
   ============================================================ */
hooks.s2 = {
  step(k){
    const P = prep($('#cv-s2')); if (!P) return;
    const {ctx, w, h} = P;
    const m = drawCloud(ctx, w, h, 36);
    if (k >= 1){
      ctx.font = '600 12px ' + tok('--sans');
      ctx.setLineDash([4,4]); ctx.strokeStyle = tok('--muted'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(m.cx, m.cy, 8*m.sc, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(m.cx, m.cy, 30*m.sc, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = tok('--ink');
      ctx.fillText('가까움: 점이 빽빽', m.cx + 8*m.sc*0.72 + 4, m.cy - 8*m.sc*0.72);
      ctx.fillText('멂: 점이 듬성듬성', m.cx + 30*m.sc*0.72 + 4, m.cy - 30*m.sc*0.72 + 14);
    }
    if (k >= 2){
      for (const o of OBJS) strokeBox(ctx, o, m, tok('--ink'), 1.4);
    }
    if (k >= 3){
      ctx.font = '12px ' + tok('--sans'); ctx.fillStyle = tok('--ink');
      const seen = new Set();
      for (const o of OBJS){
        if (o.cls === '방호벽' && seen.has('방호벽')) continue;
        if (o.cls === '콘' && seen.has('콘')) continue;
        seen.add(o.cls);
        const X = m.cx + o.x*m.sc, Y = m.cy - o.y*m.sc;
        if (X < 10 || X > w-40 || Y < 10 || Y > h-10) continue;
        ctx.fillText(o.cls, X + 8, Y - Math.max(o.w,o.l)*m.sc/2 - 3);
      }
    }
  }
};

/* ============================================================
   S4 pipeline map
   ============================================================ */
hooks.s4 = {
  init(){
    const g = $('#s4nodes'), b = $('#s4bands');
    const N = [
      ['점 구름','[N, 5]','센서가 본 세상 그대로'],
      ['복셀화','[V,5] + [V,4]','점을 격자 칸에 정리'],
      ['3D Sparse 백본','[128,2,180,180]','빈칸 빼고 3D 모양 이해'],
      ['BEV 변환','[256,180,180]','위에서 본 지도로 펴기'],
      ['Neck','[512,180,180]','작은·큰 물체 문맥 결합'],
      ['CenterHead','6 × [C,180,180]','칸마다 중심·속성 예측'],
      ['디코드 + NMS','[K, 11]','박스로 복원, 중복 제거']
    ];
    N.forEach((n,i) => {
      const x = 5 + i*172, grp = S('g', {class:'frag', 'data-s': i+1}, g);
      S('rect', {x, y:20, width:150, height:128, rx:5, class: i===5 ? 'f-heat-s s-heat' : 'f-bg s-line', 'stroke-width':1.5}, grp);
      S('text', {x:x+12, y:44, style:'font-size:11px', class:'mono mut'}, grp, '0' + (i+1));
      S('text', {x:x+12, y:68, style:'font-weight:700;font-size:15px'}, grp, n[0]);
      S('text', {x:x+12, y:92, class:'mono violet', style:'font-size:11.5px'}, grp, n[1]);
      S('text', {x:x+12, y:128, style:'font-size:12.5px'}, grp, n[2]);
      if (i < 6) S('path', {d:`M${x+151} 84H${x+170}`, class:'s-ink', 'stroke-width':1.5, 'marker-end':'url(#ah-ink)'}, grp);
    });
    const B = [
      [0,0,'CPU · 입력','f-panel2','mut',''],
      [1,1,'CUDA 커널','f-teal-s','teal','1.36 ms'],
      [2,3,'libspconv','f-violet-s','violet','22.3 ms'],
      [4,5,'TensorRT','f-heat-s','heat','11.3 ms'],
      [6,6,'CUDA + CPU','f-teal-s','teal','4.4 ms']
    ];
    B.forEach(([a,z,l,f,tc,ms]) => {
      const x = 5 + a*172, wd = (z-a)*172 + 150;
      S('rect', {x, y:170, width:wd, height:34, rx:4, class:f}, b);
      S('text', {x:x+10, y:192, class:tc, style:'font-weight:600'}, b, l);
      if (ms) S('text', {x:x+wd-10, y:192, class:'mono ' + tc, 'text-anchor':'end'}, b, ms);
    });
    S('text', {x:5, y:236, class:'mut', style:'font-size:12px'}, b, 'Orin 평균 지연 합계 ≈ 40 ms (≈ 23~25 FPS) · 3D 백본이 절반 이상');
  }

/* ============================================================
   S5 multi-sweep
   ============================================================ */
hooks.s5 = (function(){
  let raf = 0, anim0 = 0;
  const r = rng(11), sweeps = [];
  const sensor = [0, -9];
  function carPts(cx, cy, n, rr){
    const o = {x:cx, y:cy, yaw:0, w:1.9, l:4.5}, out = [];
    const edges = [[[o.l/2,-o.w/2],[o.l/2,o.w/2],[1,0]],[[-o.l/2,-o.w/2],[-o.l/2,o.w/2],[-1,0]],[[-o.l/2,o.w/2],[o.l/2,o.w/2],[0,1]],[[-o.l/2,-o.w/2],[o.l/2,-o.w/2],[0,-1]]];
    let made = 0, guard = 0;
    while (made < n && guard++ < n*8){
      const e = edges[Math.floor(rr()*4)], f = rr();
      const x = o.x + e[0][0] + (e[1][0]-e[0][0])*f, y = o.y + e[0][1] + (e[1][1]-e[0][1])*f;
      if (e[2][0]*(x - sensor[0]) + e[2][1]*(y - sensor[1]) > 0) continue;
      out.push([x + gauss(rr)*0.03, y + gauss(rr)*0.03]); made++;
    }
    return out;
  }
  for (let s = 0; s < 10; s++){
    const dt = s * 0.05;
    const pts = [];
    carPts(1.5 - 8*dt, 0, 34, r).forEach(p => pts.push(p));
    carPts(-3.5, 5.5, 22, r).forEach(p => pts.push(p));
    for (let k = 0; k < 90; k++){ const x = -9 + r()*18, y = -2.5 + r()*12; if (Math.abs(y) < 1.3 && x > -4 && x < 4.5) continue; if (r() < .5) pts.push([x, y]); }
    sweeps.push({dt, pts});
  }
  function draw(k, t){
    const P = prep($('#cv-s5')); if (!P) return;
    const {ctx, w, h} = P;
    ctx.fillStyle = tok('--bg'); ctx.fillRect(0,0,w,h);
    const sc = Math.min(w/20, h/15), cx = w/2, cy = h*0.62;
    const heat = tok('--heat'), vio = tok('--violet');
    let show = k >= 4 ? 10 : 1;
    if (k === 4 && !reduced){ show = Math.min(10, 1 + Math.floor((t - anim0) / 140)); }
    for (let s = show-1; s >= 0; s--){
      const sw = sweeps[s];
      ctx.fillStyle = s === 0 ? heat : lerpHex(heat.startsWith('#')?heat:'#f2a24a', vio.startsWith('#')?vio:'#9a96fa', Math.min(1, .35 + s/9*.65));
      ctx.globalAlpha = s === 0 ? 1 : .85;
      for (const p of sw.pts){ ctx.beginPath(); ctx.arc(cx + p[0]*sc, cy - p[1]*sc, 2.1, 0, Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    ctx.font = '12px ' + tok('--sans'); ctx.fillStyle = tok('--ink');
    ctx.fillText('움직이는 차 (8 m/s →)', cx + 1.5*sc - 60, cy + 1.9*sc);
    ctx.fillText('서 있는 차', cx - 3.5*sc - 28, cy - 5.5*sc - 1.6*sc);
    if (k >= 5){
      ctx.strokeStyle = tok('--ink'); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx - 2.2*sc, cy + 1.35*sc); ctx.lineTo(cx + 3.7*sc, cy + 1.35*sc); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 3.7*sc, cy + 1.35*sc); ctx.lineTo(cx + 3.7*sc - 8, cy + 1.35*sc - 5); ctx.lineTo(cx + 3.7*sc - 8, cy + 1.35*sc + 5); ctx.closePath(); ctx.fillStyle = tok('--ink'); ctx.fill();
      ctx.fillText('꼬리 길이 ≈ 속도 × 0.45 s', cx - 2.2*sc, cy + 2.6*sc);
    }
    ctx.fillStyle = tok('--muted');
    ctx.fillText(k >= 4 ? '10 sweep 누적 (≈ 0.5 s)' : '1 sweep (현재)', 12, 20);
    if (k === 4 && show < 10 && !reduced) raf = requestAnimationFrame(tt => draw(k, tt));
  }
  return {
    step(k){ cancelAnimationFrame(raf); anim0 = performance.now(); draw(k, anim0); },
    leave(){ cancelAnimationFrame(raf); }
  };
})();

hooks.s8 = (function(){

    const out = new Set();

      let hit = false;

    let hit = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (Aset.has(key(2*ox+dx, 2*oy+dy))) hit = true;
    if (hit) coarse.add(key(ox,oy));

  }

  }
  function kernelLoop(list, cellSize, span){
    clearInterval(timer); gK.innerHTML = '';
    if (!list.length) return;
    const r = S('rect', {width:span*cellSize, height:span*cellSize, class:'f-none s-ink', 'stroke-width':2.5, rx:3}, gK);

  }

      if (k === 1){ cells(gOut, new Set(all), 'f-heat', 1, .28); kernelLoop(toList(new Set(all)), C, 3); mode.textContent = 'Dense conv'; cnt.textContent = '계산 위치 144 / 144 · 출력 전부 채워짐'; }
      if (k === 2){ cells(gOut, D1, 'f-heat', 1, .4); kernelLoop(toList(D1), C, 3); mode.textContent = 'Sparse conv (1층)'; cnt.textContent = `계산 위치 ${D1.size} · 활성 ${Aset.size} → ${D1.size}`; }
      if (k === 3){ cells(gOut, D2, 'f-heat', 1, .4); kernelLoop(toList(D2), C, 3); mode.textContent = 'Sparse conv (2층)'; cnt.textContent = `활성 ${Aset.size} → ${D1.size} → ${D2.size} (번짐 누적)`; }
      if (k === 4){ cells(gOut, Aset, 'f-heat', 1, .55); kernelLoop(toList(Aset), C, 3); mode.textContent = 'SubM conv'; cnt.textContent = `계산 위치 ${Aset.size} · 몇 층을 쌓아도 ${Aset.size}`; }

   S14 heatmap
   ============================================================ */
const TASKS = ['승용차','트럭·공사차량','버스·트레일러','방호벽','오토바이·자전거','보행자·콘'];
const HEAT = (function(){
  const r = rng(21), maps = [];
  for (let t = 0; t < 6; t++){
    const m = new Float32Array(180*180);
    for (let i = 0; i < m.length; i++) m[i] = r()*r()*0.04;
    for (const o of OBJS){
      if (o.task !== t) continue;
      const col = (o.x + 54)/0.6, row = (o.y + 54)/0.6;
      const ci = Math.floor(col), ri = Math.floor(row);
      const rad = 2, sig = (2*rad+1)/6;
      const peak = o === OBJS[0] ? 0.91 : 0.7 + r()*0.25;
      for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++){
        const x = ci + dx, y = ri + dy; if (x < 0 || y < 0 || x >= 180 || y >= 180) continue;
        const v = peak * Math.exp(-(dx*dx + dy*dy)/(2*sig*sig));
        const idx = y*180 + x; m[idx] = Math.max(m[idx], v);
      }
    }
    maps.push(m);
  }
  return maps;
})();

function iou(a, b){
  const pa = corners(a), pb = corners(b);
  const ccw = p => { let s = 0; for (let i = 0; i < p.length; i++){ const [x1,y1] = p[i], [x2,y2] = p[(i+1)%p.length]; s += x1*y2 - x2*y1; } return s > 0 ? p : p.slice().reverse(); };
  const inter = clip(ccw(pa), ccw(pb));
  const I = inter.length > 2 ? polyArea(inter) : 0;
  return I / (a.l*a.w + b.l*b.w - I);
}
const CANDS = (function(){
  const r = rng(99), out = [];
  OBJS.forEach((o, oi) => {
    if (Math.abs(o.x) > 30 || Math.abs(o.y) > 24) return;
    const ci = Math.floor((o.x+54)/0.6), ri = Math.floor((o.y+54)/0.6);
    const m = HEAT[o.task];
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++){
      const v = m[(ri+dy)*180 + ci+dx];
      if (!(v > 0.1)) continue;
      out.push({oi, score:v, cell:[ci+dx, ri+dy], x:o.x + gauss(r)*0.18, y:o.y + gauss(r)*0.18, yaw:o.yaw + gauss(r)*0.06, w:o.w*(1+gauss(r)*0.05), l:o.l*(1+gauss(r)*0.05), cls:o.cls});
    }
  });
  out.sort((a,b) => b.score - a.score);
  const keep = [], dead = new Set();
  out.forEach((c,i) => {
    if (dead.has(i)) return;
    keep.push(i);
    for (let j = i+1; j < out.length; j++) if (!dead.has(j) && iou(c, out[j]) > 0.2) dead.add(j);
  });
  out.forEach((c,i) => c.keep = keep.includes(i));
  return out;
})();
hooks.s18 = (function(){
  let raf = 0, t0 = 0;
  function draw(k, t){
    const P = prep($('#cv-s18')); if (!P) return;
    const {ctx, w, h} = P;
    const R = 26, sc = Math.min(w,h)/(2*R), cx = w/2, cy = h/2, m = {sc, cx, cy};
    ctx.fillStyle = tok('--bg'); ctx.fillRect(0,0,w,h);
    ctx.globalAlpha = .35;
    for (const p of POINTS){ const X = cx + p[0]*sc, Y = cy - p[1]*sc; if (X<0||Y<0||X>w||Y>h) continue; ctx.fillStyle = zColor(p[2]); ctx.fillRect(X-.7, Y-.7, 1.4, 1.4); }
    ctx.globalAlpha = 1;
    const heat = tok('--heat'), rose = tok('--rose'), ink = tok('--ink');
    if (k === 1){
      for (const c of CANDS){ const X = cx + ((c.cell[0]+.5)*0.6 - 54)*sc, Y = cy - ((c.cell[1]+.5)*0.6 - 54)*sc; ctx.fillStyle = heat; ctx.globalAlpha = .4 + .6*c.score; ctx.beginPath(); ctx.arc(X, Y, 3, 0, Math.PI*2); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    if (k === 2){ for (const c of CANDS){ ctx.globalAlpha = .3 + .6*c.score; strokeBox(ctx, c, m, heat, 1.2, false); } ctx.globalAlpha = 1; }
    if (k === 3){
      const e = reduced ? 1 : Math.min(1, (t - t0)/1600);
      for (const c of CANDS){
        if (c.keep){ strokeBox(ctx, c, m, heat, 2, true); continue; }
        if (e < .5){ ctx.globalAlpha = .9; strokeBox(ctx, c, m, rose, 1.4, false); }
        else { ctx.globalAlpha = Math.max(0, 1 - (e - .5)*2); strokeBox(ctx, c, m, rose, 1.4, false); }
      }
      ctx.globalAlpha = 1;
      if (e < 1) raf = requestAnimationFrame(tt => draw(k, tt));
    }
    if (k >= 4){
      ctx.font = '11px ' + tok('--sans');
      for (const c of CANDS){ if (!c.keep) continue; strokeBox(ctx, c, m, heat, 2, true); const X = cx + c.x*sc, Y = cy - c.y*sc; ctx.fillStyle = ink; ctx.fillText(`${c.cls} ${c.score.toFixed(2)}`, X + 6, Y - Math.max(c.l, c.w)*sc/2 - 3); }
    }
    ctx.fillStyle = ink; ctx.beginPath(); ctx.moveTo(cx+7, cy); ctx.lineTo(cx-5, cy-5); ctx.lineTo(cx-5, cy+5); ctx.closePath(); ctx.fill();
    ctx.font = '12px ' + tok('--sans'); ctx.fillStyle = tok('--muted');
    const nk = CANDS.filter(c => c.keep).length;
    const msg = ['', `후보 칸 ${CANDS.length}개`, `후보 박스 ${CANDS.length}개 (겹침 많음)`, `NMS: ${CANDS.length - nk}개 제거`, `최종 ${nk}개`, `최종 ${nk}개`, `최종 ${nk}개`][k] || '';
    ctx.fillText(msg, 12, 20);
  }
  return {
    step(k){ cancelAnimationFrame(raf); t0 = performance.now(); draw(k, t0); },
    leave(){ cancelAnimationFrame(raf); }
  };
})();

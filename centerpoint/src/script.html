<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
/* ============================================================
   helpers
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
function S(tag, attrs, parent, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(r){ let u = 0, v = 0; while(!u) u = r(); while(!v) v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function prep(c){
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return null;
  const d = 2;
  if (c.width !== w*d || c.height !== h*d){ c.width = w*d; c.height = h*d; }
  const ctx = c.getContext('2d');
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,w,h);
  return {ctx, w, h};
}
function hexA(hex, a){
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(x=>x+x).join('');
  const n = parseInt(hex,16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
function lerpHex(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round((pa>>16&255)*(1-t)+(pb>>16&255)*t), g = Math.round((pa>>8&255)*(1-t)+(pb>>8&255)*t), bl = Math.round((pa&255)*(1-t)+(pb&255)*t);
  return `rgb(${r},${g},${bl})`;
}
function zColor(z){ // -2 .. 2 m
  const t = Math.max(0, Math.min(1, (z + 1.9) / 3.2));
  return t < .5 ? lerpHex('#3b6fd0','#2bb3a8', t*2) : lerpHex('#2bb3a8','#f0a040', (t-.5)*2);
}
function corners(o){
  const c = Math.cos(o.yaw||0), s = Math.sin(o.yaw||0), L = o.l/2, W = o.w/2;
  return [[L,W],[-L,W],[-L,-W],[L,-W]].map(([a,b]) => [o.x + a*c - b*s, o.y + a*s + b*c]);
}

/* ============================================================
   virtual scene (for illustration only)
   ============================================================ */
const G = -1.8; // ground height relative to sensor
const OBJS = [
  {x:12.22, y:3.37, yaw:0.524, w:1.94, l:4.62, h:1.54, cls:'승용차', task:0, v:[3.2,0.4]},
  {x:-8, y:6.5, yaw:0, w:1.9, l:4.5, h:1.5, cls:'승용차', task:0, v:[0,0]},
  {x:20, y:-9, yaw:1.57, w:2.0, l:4.8, h:1.6, cls:'승용차', task:0, v:[0,-5]},
  {x:-16, y:-4, yaw:0.1, w:1.8, l:4.3, h:1.5, cls:'승용차', task:0, v:[6,0.6]},
  {x:-30, y:-12, yaw:0.05, w:1.9, l:4.6, h:1.5, cls:'승용차', task:0, v:[0,0]},
  {x:33, y:8, yaw:-0.3, w:1.9, l:4.5, h:1.5, cls:'승용차', task:0, v:[-7,2]},
  {x:6, y:-19, yaw:0, w:2.9, l:11, h:3.2, cls:'버스', task:2, v:[4,0]},
  {x:-25, y:16, yaw:0.2, w:2.5, l:7, h:3, cls:'트럭', task:1, v:[0,0]},
  {x:6, y:9, yaw:0, w:0.7, l:0.7, h:1.7, cls:'보행자', task:5, v:[0,1.2]},
  {x:7.2, y:10, yaw:0, w:0.7, l:0.7, h:1.7, cls:'보행자', task:5, v:[0,1.1]},
  {x:-4, y:-9.5, yaw:0, w:0.7, l:0.7, h:1.7, cls:'보행자', task:5, v:[1,0]},
  {x:3, y:-5, yaw:0, w:0.4, l:0.4, h:0.7, cls:'콘', task:5, v:[0,0]},
  {x:3.6, y:-6.2, yaw:0, w:0.4, l:0.4, h:0.7, cls:'콘', task:5, v:[0,0]},
  {x:4.2, y:-7.4, yaw:0, w:0.4, l:0.4, h:0.7, cls:'콘', task:5, v:[0,0]},
  {x:-12, y:12, yaw:0.3, w:0.6, l:1.8, h:1.4, cls:'자전거', task:4, v:[2,0.6]},
  ...[0,1,2,3,4].map(i => ({x:-2+i*2.2, y:14, yaw:0, w:0.5, l:2, h:1, cls:'방호벽', task:3, v:[0,0]}))
];
const POINTS = (function(){
  const r = rng(7), pts = [];
  for (let i = 0; i < 34; i++){
    const rad = 2.4 * Math.pow(1.1, i);
    if (rad > 54) break;
    const n = 1100;
    for (let k = 0; k < n; k++){
      if (r() < .45) continue;
      const a = (k / n) * Math.PI * 2 + r()*0.002;
      const x = rad*Math.cos(a), y = rad*Math.sin(a);
      if (Math.abs(y) > 24) continue;
      pts.push([x, y, G + gauss(r)*0.04, 1]);
    }
  }
  // building walls at |y| = 24
  for (const wy of [24, -24]){
    for (let x = -50; x < 50; x += 0.18){
      const d = Math.hypot(x, wy);
      if (r() > 30/d) continue;
      for (let z = G; z < G + 5; z += 0.35 + r()*0.2) pts.push([x + gauss(r)*0.03, wy + gauss(r)*0.05, z, 2]);
    }
  }
  // poles / trees
  for (const [px,py] of [[-20,21],[0,21.5],[18,-21],[28,20],[-38,-21],[40,-20]]){
    for (let k = 0; k < 60; k++) pts.push([px + gauss(r)*0.6, py + gauss(r)*0.6, G + 1.5 + r()*3, 2]);
  }
  // objects: visible faces only
  for (const o of OBJS){
    const dist = Math.hypot(o.x, o.y);
    const n = Math.max(10, Math.min(420, 2600/(dist+2) * Math.sqrt((o.l*o.w)/8 + .15)));
    const c = Math.cos(o.yaw), s = Math.sin(o.yaw);
    const edges = [[[o.l/2,-o.w/2],[o.l/2,o.w/2],[1,0]],[[-o.l/2,-o.w/2],[-o.l/2,o.w/2],[-1,0]],[[-o.l/2,o.w/2],[o.l/2,o.w/2],[0,1]],[[-o.l/2,-o.w/2],[o.l/2,-o.w/2],[0,-1]]];
    const lens = edges.map(e => Math.hypot(e[1][0]-e[0][0], e[1][1]-e[0][1]));
    const tot = lens.reduce((a,b)=>a+b,0);
    let made = 0, guard = 0;
    while (made < n && guard++ < n*6){
      let t = r()*tot, ei = 0;
      while (t > lens[ei]) { t -= lens[ei]; ei++; }
      const e = edges[ei], f = t / lens[ei];
      const lx = e[0][0] + (e[1][0]-e[0][0])*f, ly = e[0][1] + (e[1][1]-e[0][1])*f;
      const wx = o.x + lx*c - ly*s, wy = o.y + lx*s + ly*c;
      const nx = e[2][0]*c - e[2][1]*s, ny = e[2][0]*s + e[2][1]*c;
      if (nx*wx + ny*wy > 0) continue;
      pts.push([wx + gauss(r)*0.02, wy + gauss(r)*0.02, G + r()*o.h, 3]);
      made++;
    }
  }
  return pts;
})();

function drawCloud(ctx, w, h, R, opts={}){
  const sc = Math.min(w, h) / (2*R), cx = w/2, cy = h/2;
  ctx.fillStyle = tok('--bg'); ctx.fillRect(0,0,w,h);
  for (const p of POINTS){
    const X = cx + p[0]*sc, Y = cy - p[1]*sc;
    if (X < 0 || Y < 0 || X > w || Y > h) continue;
    ctx.globalAlpha = p[3] === 1 ? .38 : .95;
    ctx.fillStyle = zColor(p[2]);
    const s = p[3] === 3 ? 2.4 : 1.2;
    ctx.fillRect(X - s/2, Y - s/2, s, s);
  }
  ctx.globalAlpha = 1;
  // ego
  ctx.fillStyle = tok('--ink');
  ctx.beginPath(); ctx.moveTo(cx+7, cy); ctx.lineTo(cx-5, cy-5); ctx.lineTo(cx-5, cy+5); ctx.closePath(); ctx.fill();
  return {sc, cx, cy};
}
function strokeBox(ctx, o, m, color, lw=1.5, heading=true){
  const cs = corners(o).map(([x,y]) => [m.cx + x*m.sc, m.cy - y*m.sc]);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); cs.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.stroke();
  if (heading){
    ctx.beginPath(); ctx.moveTo((cs[0][0]+cs[3][0])/2, (cs[0][1]+cs[3][1])/2); ctx.lineTo(m.cx + o.x*m.sc, m.cy - o.y*m.sc); ctx.stroke();
  }
}

/* ============================================================
   slide engine
   ============================================================ */
const slides = $$('.slide');
const STAGES = [['input','입력'],['voxel','복셀화'],['sparse','3D Sparse 백본'],['bev','BEV'],['neck','Neck'],['head','Head'],['train','학습'],['post','후처리'],['deploy','Orin 배포']];
const hooks = {};
const inited = new Set();
let cur = 0, step = 0;

const pmap = $('#pmap');
STAGES.forEach(([k,l]) => { const s = document.createElement('span'); s.dataset.k = k; s.textContent = l; pmap.appendChild(s); });

const tocList = $('#toc-list');
slides.forEach((s,i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button';
  b.innerHTML = `<span>${i+1}</span>${s.dataset.title}`;
  b.addEventListener('click', () => { go(i, 0); togglePanel('toc', false); });
  li.appendChild(b); tocList.appendChild(li);
});

function nSteps(i){ return +slides[i].dataset.steps || 1; }
function applyStep(){
  const s = slides[cur];
  $$('.frag', s).forEach(f => {
    const a = +f.dataset.s, u = f.dataset.u;
    f.classList.toggle('on', step >= a && (u === undefined || step < +u));
  });
  const h = hooks[s.id];
  if (h && h.step) h.step(step);
  const d = D3[s.id];
  if (d){ V3.show(d); if (d.scene && d.step) d.step(step); }
  updateUI();
}
function go(i, k){
  if (i !== cur){
    const h = hooks[slides[cur].id]; if (h && h.leave) h.leave();
    if (D3[slides[cur].id]) V3.hide();
    slides[cur].classList.remove('active');
    cur = i;
  }
  slides[cur].classList.add('active');
  const id = slides[cur].id;
  if (!inited.has(id)){ inited.add(id); const h = hooks[id]; if (h && h.init) h.init(); }
  step = Math.max(0, Math.min(k, nSteps(cur)-1));
  applyStep();
  try { history.replaceState(null, '', '#' + id); } catch(e) {}
}
function next(){ if (step < nSteps(cur)-1){ step++; applyStep(); } else if (cur < slides.length-1) go(cur+1, 0); }
function prev(){ if (step > 0){ step--; applyStep(); } else if (cur > 0) go(cur-1, nSteps(cur-1)-1); }

function updateUI(){
  const s = slides[cur], st = s.dataset.stage;
  const idx = STAGES.findIndex(x => x[0] === st);
  $$('span', pmap).forEach((e,i) => { e.classList.toggle('here', i === idx); e.classList.toggle('done', idx >= 0 && i < idx); });
  const here = $('span.here', pmap); if (here) here.scrollIntoView({block:'nearest', inline:'nearest'});
  $('#counter').textContent = `${cur+1} / ${slides.length}`;
  const dots = $('#dots'); dots.innerHTML = '';
  for (let i = 0; i < nSteps(cur); i++){ const d = document.createElement('i'); if (i <= step) d.className = 'on'; dots.appendChild(d); }
  $('#progbar').style.width = ((cur + (step+1)/nSteps(cur)) / slides.length * 100) + '%';
  const n = $('.notes', s);
  $('#notes-body').innerHTML = `<h3 style="margin-top:6px">${cur+1}. ${s.dataset.title}</h3>` + (n ? n.innerHTML : '<p class="muted">이 슬라이드에는 노트가 없습니다.</p>');
  $$('#toc-list button').forEach((b,i) => b.classList.toggle('cur', i === cur));
}
function togglePanel(id, force){
  const p = $('#'+id); const open = force === undefined ? !p.classList.contains('open') : force;
  p.classList.toggle('open', open);
  if (open){ const other = id === 'notes' ? 'toc' : 'notes'; $('#'+other).classList.remove('open'); }
}

$('#next').addEventListener('click', e => { e.stopPropagation(); next(); });
$('#prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
$('#notes-btn').addEventListener('click', () => togglePanel('notes'));
$('#toc-btn').addEventListener('click', () => togglePanel('toc'));
$('#notes-close').addEventListener('click', () => togglePanel('notes', false));
$('#toc-close').addEventListener('click', () => togglePanel('toc', false));
$('#stage').addEventListener('click', e => {
  if (V3.takeDrag()) return;
  if (e.target.closest('button, a, input, select, .panel, table, .btnrow')) return;
  if (window.getSelection && String(window.getSelection())) return;
  next();
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter'){ if (k === 'Enter' && e.target.closest('button')) return; e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'Home'){ go(0,0); }
  else if (k === 'End'){ go(slides.length-1, 0); }
  else if (k === 'n' || k === 'N'){ togglePanel('notes'); }
  else if (k === 't' || k === 'T'){ togglePanel('toc'); }
  else if (k === 'r' || k === 'R'){ V3.home(); }
  else if (k === 'Escape'){ togglePanel('notes', false); togglePanel('toc', false); }
});

// theme
$('#themebtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('cp-theme', root.dataset.theme); } catch(e) {}
  redraw(); V3.retheme(step);
});
try { const t = localStorage.getItem('cp-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { redraw(); V3.retheme(step); });
function redraw(){ const h = hooks[slides[cur].id]; if (h && h.step) h.step(step); }

// scaling
const stage = $('#stage'), vp = $('#viewport');
function fit(){
  const flow = window.innerWidth < 760;
  document.body.classList.toggle('flow', flow);
  if (flow){ stageScale = 1; stage.style.transform = ''; stage.style.position = ''; stage.style.left = ''; stage.style.top = ''; }
  else {
    const r = vp.getBoundingClientRect();
    const s = Math.min((r.width - 8) / 1280, (r.height - 16) / 720);
    stage.style.position = 'absolute'; stage.style.left = '50%'; stage.style.top = '50%';
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
    stageScale = s;
  }
  V3.size();
  redraw();
}
window.addEventListener('resize', fit);

/* ============================================================
   3D engine: one shared Three.js renderer moved between slides
   ============================================================ */
const HAS3 = typeof THREE !== 'undefined';
const D3 = {};
const PSCALE = {value: 400};
let stageScale = 1;

const VS = `
attribute vec3 acol; attribute float aal;
uniform float uSize; uniform float uScale; uniform float uSweep; uniform float uSweepOn;
varying vec3 vC; varying float vA;
void main(){
  vC = acol; float a = aal;
  if (uSweepOn > 0.5){ float ang = atan(-position.z, position.x); float d = mod(uSweep - ang, 6.2831853); a *= max(0.14, 1.0 - d / 6.2831853); }
  vA = a;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_PointSize = max(1.5, uSize * uScale / -mv.z);
  gl_Position = projectionMatrix * mv;
}`;
const FS = `
varying vec3 vC; varying float vA; uniform float uOp;
void main(){ vec2 c = gl_PointCoord - 0.5; if (dot(c, c) > 0.25) discard; gl_FragColor = vec4(vC, vA * uOp); }`;

function mats(o){ return o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : []; }
function applyFade(o, v){
  o.visible = v > 0.01;
  o.traverse(ch => mats(ch).forEach(m => {
    if (m.uniforms && m.uniforms.uOp) m.uniforms.uOp.value = v;
    else m.opacity = m.userData.base * v;
  }));
}
const lvl = on => typeof on === 'number' ? on : (on ? 1 : 0); // true/false or an opacity level 0..1
function fade(d, obj, on){
  if (!obj.userData.faded){
    obj.userData.faded = true;
    obj.traverse(ch => mats(ch).forEach(m => { if (m.userData.base === undefined){ m.userData.base = m.opacity; m.transparent = true; } }));
    obj.userData.cur = lvl(on);
    applyFade(obj, obj.userData.cur);
    d.fades.add(obj);
  }
  obj.userData.goal = lvl(on);
}
function runFades(d, k){
  for (const o of d.fades){
    const u = o.userData;
    if (u.cur === u.goal) continue;
    u.cur += (u.goal - u.cur) * k;
    if (Math.abs(u.goal - u.cur) < 0.01) u.cur = u.goal;
    applyFade(o, u.cur);
  }
}
function disposeScene(S){
  S.traverse(o => { if (o.geometry) o.geometry.dispose(); mats(o).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); });
}

const V3 = (function(){
  let R = null, cam = null, def = null, host = null, raf = 0, last = 0, dragged = false, auto = true, home = null;
  const ctl = {theta:.8, phi:1, r:30, tx:0, ty:0, tz:0}, goal = Object.assign({}, ctl);
  function ensure(){
    if (R) return true;
    if (!HAS3) return false;
    R = new THREE.WebGLRenderer({antialias:true, alpha:true});
    R.setClearColor(0x000000, 0);
    cam = new THREE.PerspectiveCamera(38, 1, 0.02, 900);
    const el = R.domElement;
    let down = null;
    el.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, th:goal.theta, ph:goal.phi, moved:false}; try { el.setPointerCapture(e.pointerId); } catch(_){} });
    el.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) down.moved = true;
      if (!down.moved) return;
      auto = false;
      goal.theta = ctl.theta = down.th - dx * 0.008 / stageScale;
      goal.phi = ctl.phi = Math.max(0.1, Math.min(1.54, down.ph - dy * 0.006 / stageScale));
    });
    const up = () => { if (down && down.moved) dragged = true; down = null; };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { e.preventDefault(); goal.r = Math.max(0.8, Math.min(300, goal.r * (1 + Math.sign(e.deltaY) * 0.1))); }, {passive:false});
    return true;
  }
  function size(){
    if (!R || !host) return;
    const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
    const pr = Math.min(2.5, (window.devicePixelRatio || 1) * Math.max(stageScale, .6));
    R.setPixelRatio(pr); R.setSize(w, h, false);
    cam.aspect = w / h; cam.updateProjectionMatrix();
    PSCALE.value = h * pr / (2 * Math.tan(cam.fov * Math.PI / 360));
  }
  function loop(t){
    if (!def) return;
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if (auto && !reduced && def.spin !== false) goal.theta += dt * (def.spinRate || 0.045);
    const k = 1 - Math.exp(-dt * 3.2);
    for (const p of ['theta','phi','r','tx','ty','tz']) ctl[p] += (goal[p] - ctl[p]) * k;
    const sp = Math.sin(ctl.phi);
    cam.position.set(ctl.tx + ctl.r*sp*Math.sin(ctl.theta), ctl.ty + ctl.r*Math.cos(ctl.phi), ctl.tz + ctl.r*sp*Math.cos(ctl.theta));
    cam.lookAt(ctl.tx, ctl.ty, ctl.tz);
    runFades(def, reduced ? 1 : Math.min(1, k * 1.6));
    raf = requestAnimationFrame(loop);
    if (def.update) def.update(t, dt);
    R.render(def.scene, cam);
  }
  function show(d){
    const h = $(d.host); if (!h) return;
    if (!ensure()){
      if (!h.querySelector('.v3err')) h.insertAdjacentHTML('beforeend', '<div class="v3err">3D 보기를 불러오지 못했습니다.<br>인터넷 연결을 확인하세요 (three.js, cdnjs).</div>');
      return;
    }
    if (def === d && host === h && R.domElement.parentNode === h) return;
    host = h; def = d;
    h.appendChild(R.domElement);
    if (!d.scene){ d.scene = new THREE.Scene(); d.fades = new Set(); d.build(d.scene); }
    home = Object.assign({theta:.8, phi:1, r:30, tx:0, ty:0, tz:0}, d.cam);
    Object.assign(goal, home); Object.assign(ctl, home); auto = true;
    size();
    cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(loop);
  }
  return {
    show, size,
    get def(){ return def; },
    view(v){ Object.assign(goal, v); },
    home(){ if (home){ Object.assign(goal, home); auto = true; } },
    hide(){ cancelAnimationFrame(raf); if (R && R.domElement.parentNode) R.domElement.parentNode.removeChild(R.domElement); def = null; host = null; },

const BEVG = (function(){
  let cache = null;
  function blur(a, n, it){
    let s = a;
    for (let t = 0; t < it; t++){
      const o = new Float32Array(n*n);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
        let sum = 0, c = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){ const X = x+dx, Y = y+dy; if (X<0||Y<0||X>=n||Y>=n) continue; sum += s[Y*n+X]; c++; }
        o[y*n+x] = sum / c;
      }
      s = o;
    }
    let m = 0; for (const v of s) m = Math.max(m, v);
    return s.map(v => v / (m || 1));
  }
  return function(){
    if (cache) return cache;
    const n = 180, occ = new Float32Array(n*n);
    for (const p of POINTS){ if (p[3] === 1) continue; const c = Math.floor((p[0]+54)/.6), r = Math.floor((p[1]+54)/.6); if (c<0||r<0||c>=n||r>=n) continue; occ[r*n+c] += 1; }
    for (let i = 0; i < occ.length; i++) occ[i] = Math.min(1, occ[i] / 5);

    const dn = new Float32Array(90*90);
    for (let r = 0; r < 90; r++) for (let c = 0; c < 90; c++) dn[r*90+c] = Math.max(occ[(2*r)*n+2*c], occ[(2*r+1)*n+2*c], occ[(2*r)*n+2*c+1], occ[(2*r+1)*n+2*c+1]);

    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) mix[r*n+c] = Math.max(b1[r*n+c]*.9, d2[(r>>1)*90+(c>>1)]*.7);

  };
})();

const HEAT = (function(){

function polyArea(p){ let a = 0; for (let i = 0; i < p.length; i++){ const [x1,y1] = p[i], [x2,y2] = p[(i+1)%p.length]; a += x1*y2 - x2*y1; } return Math.abs(a)/2; }
function clip(subj, clipP){
  let out = subj;
  for (let i = 0; i < clipP.length; i++){
    const A = clipP[i], B = clipP[(i+1)%clipP.length], inp = out; out = [];
    if (!inp.length) break;
    const side = P => (B[0]-A[0])*(P[1]-A[1]) - (B[1]-A[1])*(P[0]-A[0]);
    for (let j = 0; j < inp.length; j++){
      const P = inp[j], Q = inp[(j+1)%inp.length], sp = side(P), sq = side(Q);
      if (sp >= 0) out.push(P);
      if ((sp >= 0) !== (sq >= 0)){ const t = sp/(sp - sq); out.push([P[0] + (Q[0]-P[0])*t, P[1] + (Q[1]-P[1])*t]); }
    }
  }
  return out;
}
function iou(a, b){
  const pa = corners(a), pb = corners(b);

  const inter = clip(ccw(pa), ccw(pb));
  const I = inter.length > 2 ? polyArea(inter) : 0;
  return I / (a.l*a.w + b.l*b.w - I);
}

/* ============================================================
   S5 multi-sweep in 3D
   ============================================================ */
D3.s5 = (function(){
  const r = rng(11), sensor = [0, -9], raw = [], cum = [];
  function carPts(cx, cy, n){
    const o = {x:cx, y:cy, w:1.9, l:4.5}, out = [];
    const E = [[[o.l/2,-o.w/2],[o.l/2,o.w/2],[1,0]],[[-o.l/2,-o.w/2],[-o.l/2,o.w/2],[-1,0]],[[-o.l/2,o.w/2],[o.l/2,o.w/2],[0,1]],[[-o.l/2,-o.w/2],[o.l/2,-o.w/2],[0,-1]]];
    let made = 0, guard = 0;
    while (made < n && guard++ < n*10){
      const e = E[Math.floor(r()*4)], f = r();
      const x = o.x + e[0][0] + (e[1][0]-e[0][0])*f, y = o.y + e[0][1] + (e[1][1]-e[0][1])*f;
      if (e[2][0]*(x - sensor[0]) + e[2][1]*(y - sensor[1]) > 0) continue;
      out.push([x + gauss(r)*.03, y + gauss(r)*.03, .25 + r()*1.3]); made++;
    }
    return out;
  }
  for (let s = 0; s < 10; s++){
    const dt = s * .05;
    carPts(1.5 - 8*dt, 0, 60).forEach(p => raw.push([...p, s]));
    carPts(-3.5, 5.5, 34).forEach(p => raw.push([...p, s]));
    for (let k = 0; k < 110; k++){ const x = -9 + r()*18, y = -3 + r()*12; if (Math.abs(y) < 1.2 && x > -4.5 && x < 4) continue; if (r() < .5) raw.push([x, y, 0, s]); }
    cum.push(raw.length);
  }
  return {
    host:'#v3-s5', cam:{r:14, phi:.92, theta:.35, tx:-1, ty:.6, tz:-2}, spinRate:.02,
    build(S){
      lights(S); S.add(gridH(20, 20, .25));
      const heat = tok('--heat'), vio = tok('--violet'), c = new THREE.Color();
      this.p = points(raw.map(([x,y,z,s]) => { c.set(s === 0 ? heat : lerpHex(heat, vio, Math.min(1, .35 + s/9*.65))); return [x, z, -y, c.r, c.g, c.b, s === 0 ? 1 : .8]; }), .07);
      this.p.geometry.setDrawRange(0, cum[0]);
      S.add(this.p);
      S.add(label('움직이는 차 (8 m/s →)', {pos:T3(1.2, 0, 2.4), size:.45}));
      S.add(label('서 있는 차', {pos:T3(-3.5, 5.5, 2.3), size:.45}));
      const ink = tok('--ink');
      this.tail = new THREE.Group();
      this.tail.add(arrow(T3(-4.4, -1.6, .1), T3(-.6, -1.6, .1), ink, .35, .2));
      this.tail.add(label('꼬리 길이 ≈ 속도 × 0.45 s', {pos:T3(-2.5, -2.3, .5), size:.4}));
      S.add(this.tail); fade(this, this.tail, false);
    },
    step(k){
      this.k = k; this.t0 = performance.now();
      if (k < 4 || reduced) this.p.geometry.setDrawRange(0, k < 4 ? cum[0] : cum[9]);
      fade(this, this.tail, k >= 5);
    },
    update(t){
      if (this.k === 4 && !reduced){ const i = Math.min(9, Math.floor((t - this.t0) / 150)); this.p.geometry.setDrawRange(0, cum[i]); }
      if (this.k >= 5) this.p.geometry.setDrawRange(0, cum[9]);
    }
  };
})();

/* ============================================================
   S6 voxelization: points dropped into a 3D lattice
   ============================================================ */
D3.s6 = (function(){
  const V = (x, y, z) => new THREE.Vector3(x - 5, z, -(y - 4));
  const r = rng(5), pts = [];
  const inHot = (x,y,z) => Math.floor(x) === 4 && Math.floor(y) === 3 && Math.floor(z) === 2;
  for (let i = 0; i < 140; i++){ const x = .3 + r()*9.4, y = 3.15 + gauss(r)*.14, z = .2 + r()*3.9; if (!inHot(x,y,z)) pts.push([x,y,z]); }
  for (let i = 0; i < 60; i++){ const x = 2 + r()*6, y = 3.4 + r()*4.2, z = 4.3 + gauss(r)*.08; pts.push([x,y,z]); }
  const hot = [[4.53,3.2,2.85],[4.133,3.6,2.25],[4.8,3.867,2.6],[4.4,3.333,2.4]];
  return {
    host:'#v3-s6', cam:{r:19, phi:1.08, theta:.55, tx:0, ty:2.6, tz:0}, spinRate:.025,
    build(S){
      lights(S);
      const teal = tok('--teal'), heat = tok('--heat'), rose = tok('--rose'), ink = tok('--ink'), mut = tok('--muted'), c = new THREE.Color(teal);
      S.add(points(pts.map(([x,y,z]) => { const v = V(x,y,z); return [v.x, v.y, v.z, c.r, c.g, c.b, 1]; }), .16));
      hot.forEach((p,i) => { const s = sphere(i ? .09 : .13, i ? teal : rose); s.position.copy(V(...p)); S.add(s); });
      // lattice
      const seg = [];
      for (let y = 0; y <= 8; y++) for (let z = 0; z <= 6; z++) seg.push(V(0,y,z), V(10,y,z));
      for (let x = 0; x <= 10; x++) for (let z = 0; z <= 6; z++) seg.push(V(x,0,z), V(x,8,z));
      for (let x = 0; x <= 10; x++) for (let y = 0; y <= 8; y++) seg.push(V(x,y,0), V(x,y,6));
      this.lat = new THREE.Group();
      this.lat.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(seg), new THREE.LineBasicMaterial({color:mut, transparent:true, opacity:.16})));
      for (let i = 0; i < 10; i++) this.lat.add(label(String(880+i), {pos:V(i+.5, -.7, 0), size:.36, bg:false, color:mut}));
      for (let j = 0; j < 8; j++) this.lat.add(label(String(674+j), {pos:V(-.8, j+.5, 0), size:.36, bg:false, color:mut}));
      for (let k = 0; k < 6; k++) this.lat.add(label(String(25+k), {pos:V(-.6, -.6, k+.5), size:.36, bg:false, color:mut}));
      this.lat.add(label('ix →', {pos:V(10.8, -.7, 0), size:.4, bg:false}));
      this.lat.add(label('iy →', {pos:V(-.8, 8.6, 0), size:.4, bg:false}));
      this.lat.add(label('iz ↑', {pos:V(-.6, -.6, 6.5), size:.4, bg:false}));
      S.add(this.lat);
      // projection guides
      const p = hot[0];
      this.proj = new THREE.Group();
      this.proj.add(line([V(...p), V(p[0], p[1], 0)], rose, {dash:.15}));
      this.proj.add(line([V(p[0], p[1], 0), V(p[0], 0, 0)], rose, {dash:.15}));
      this.proj.add(line([V(p[0], p[1], 0), V(0, p[1], 0)], rose, {dash:.15}));
      this.proj.add(label('p = (12.34, −3.21, 0.57) m', {pos:V(p[0], p[1], p[2] + 1.2), size:.42, color:rose}));
      S.add(this.proj);
      // hot voxel
      this.hot = new THREE.Group();
      const hb = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({color:heat, transparent:true, opacity:.38, depthWrite:false}));
      hb.position.copy(V(4.5, 3.5, 2.5)); this.hot.add(hb);
      const hw = wireBox(1, 1, 1, heat); hw.position.copy(hb.position); this.hot.add(hw);
      this.hot.add(label('(ix, iy, iz) = (884, 677, 27)', {pos:V(4.5, -1.6, 2.6), size:.46, color:heat, bold:true}));
      S.add(this.hot);
      // all occupied voxels
      const occ = new Map();

/* ============================================================
   S8 dense / sparse / SubM / strided convolution on 3D voxels
   ============================================================ */
D3.s8 = (function(){
  const NI = 16, NJ = 8, NK = 6, key = (i,j,k) => i + ',' + j + ',' + k;
  const A = new Map();
  const add = (i,j,k) => A.set(key(i,j,k), [i,j,k]);
  for (let i = 0; i <= 9; i++) for (let k = 0; k <= 2; k++) add(i, 0, k);
  for (let j = 0; j <= 3; j++) for (let k = 0; k <= 2; k++) add(9, j, k);
  for (let i = 2; i <= 7; i++) for (let j = 0; j <= 3; j++) add(i, j, 3);
  for (let k = 0; k <= 3; k++) add(13, 2, k);
  add(5, 6, 0); add(1, 5, 1);
  function dilate(r){
    const out = new Map();
    for (const [i,j,k] of A.values())
      for (let a = -r; a <= r; a++) for (let b = -r; b <= r; b++) for (let c = -r; c <= r; c++){
        const I = i+a, J = j+b, K = k+c; if (I<0||J<0||K<0||I>=NI||J>=NJ||K>=NK) continue; out.set(key(I,J,K), [I,J,K]);
      }
    return [...out.values()];
  }
  const all = []; for (let k = 0; k < NK; k++) for (let j = 0; j < NJ; j++) for (let i = 0; i < NI; i++) all.push([i,j,k]);
  const D1 = dilate(1), D2 = dilate(2), IN = [...A.values()];
  const coarse = [];
  for (let c = 0; c < NK/2; c++) for (let b = 0; b < NJ/2; b++) for (let a = 0; a < NI/2; a++){
    let hit = false;
    for (const [i,j,k] of IN) if (Math.abs(i - 2*a) <= 1 && Math.abs(j - 2*b) <= 1 && Math.abs(k - 2*c) <= 1){ hit = true; break; }
    if (hit) coarse.push([a,b,c]);
  }
  const pos = (i,j,k) => [i + .5 - NI/2, k + .5, -(j + .5 - NJ/2)];
  const sortL = l => l.slice().sort((p,q) => p[2]-q[2] || p[1]-q[1] || p[0]-q[0]);
  return {
    host:'#v3-s8', cam:{r:23, phi:.98, theta:.7, ty:2}, spinRate:.03,
    build(S){
      lights(S); S.add(gridH(18, 18, .25));
      const teal = tok('--teal'), heat = tok('--heat'), ink = tok('--ink');
      this.inp = inst(IN.map(p => [...pos(...p), .74, .74, .74]), teal, 1); S.add(this.inp);
      this.inpDim = inst(IN.map(p => [...pos(...p), .5, .5, .5]), teal, .6); S.add(this.inpDim);
      const out = l => inst(l.map(p => [...pos(...p), .96, .96, .96]), heat, .2);
      this.outs = {
        1: out(all), 2: out(D1), 3: out(D2), 4: inst(IN.map(p => [...pos(...p), .98, .98, .98]), heat, .45),
        5: inst(coarse.map(([a,b,c]) => { const p = pos(2*a+.5, 2*b+.5, 2*c+.5); return [...p, 1.94, 1.94, 1.94]; }), heat, .22)
      };
      Object.values(this.outs).forEach(o => { S.add(o); fade(this, o, false); });
      this.kern = wireBox(3, 3, 3, ink); S.add(this.kern);
      fade(this, this.inp, true); fade(this, this.inpDim, false);
      this.lists = {0:[], 1:sortL(all), 2:sortL(D1), 3:sortL(D2), 4:sortL(IN), 5:sortL(coarse).map(([a,b,c]) => [2*a, 2*b, 2*c])};
    },
    step(k){
      const m = Math.min(k, 5);
      for (const n in this.outs) fade(this, this.outs[n], +n === m || (m === 5 && +n === 5));
      fade(this, this.inp, m < 5); fade(this, this.inpDim, m === 5);
      this.list = this.lists[m]; this.t0 = performance.now(); this.kern.visible = m > 0;
      const mode = $('#s8mode'), cnt = $('#s8count'), n = IN.length, tot = NI*NJ*NK;
      const txt = [
        ['입력: 활성 복셀 ' + n + ' / ' + tot, '활성 비율 ' + (n/tot*100).toFixed(0) + '%'],
        ['Dense conv', `계산 위치 ${tot} / ${tot} · 출력 전부 채워짐`],
        ['Sparse conv (1층)', `활성 ${n} → ${D1.length} (표면이 두꺼워짐)`],
        ['Sparse conv (2층)', `활성 ${n} → ${D1.length} → ${D2.length}`],
        ['SubM conv', `계산 위치 ${n} · 몇 층을 쌓아도 ${n}`],
        ['Sparse conv, stride 2', `${NI}×${NJ}×${NK} → ${NI/2}×${NJ/2}×${NK/2} · 활성 ${coarse.length}`]
      ][m];
      mode.textContent = txt[0]; cnt.textContent = txt[1];
    },
    update(t){
      if (!this.list || !this.list.length) return;
      const per = this.list.length > 150 ? 45 : 230;
      const i = reduced ? 0 : Math.floor(Math.max(0, t - this.t0) / per) % this.list.length;
      const p = pos(...this.list[i]); this.kern.position.set(p[0], p[1], p[2]);
    }
  };
})();

    host:'#v3-seq', cam:{r:70, phi:.9, theta:.55, tx:0, ty:0, tz:0}, spinRate:.02,

      fade(this, this.vox, k === 1); fade(this, this.bb, k === 2 || k === 3); this.bbY = k >= 3 ? .02 : 1;

      fade(this, this.bev, k === 3); fade(this, this.neck, k === 4 || k === 5);
      fade(this, this.terr, k === 5 ? 1 : k === 6 ? .35 : 0); this.growGoal = k >= 5 ? 1 : 0;
      fade(this, this.cb, k === 6); fade(this, this.fin, k === 7);
      V3.view([
        {r:70, phi:.9, tx:0, ty:0, tz:0}, {r:34, phi:.78, tx:6, ty:0, tz:-3}, {r:38, phi:.78, tx:6, ty:1, tz:-3},
        {r:86, phi:.72, tx:0, ty:0, tz:0}, {r:86, phi:.72, tx:0, ty:0, tz:0}, {r:60, phi:.8, tx:2, ty:0, tz:-2},
        {r:42, phi:.8, tx:4, ty:0, tz:-2}, {r:52, phi:.85, tx:2, ty:0, tz:-2}
      ][k]);
    },
    update(t, dt){
      const a = reduced ? 1 : 1 - Math.exp(-dt * 2.4);
      this.bb.scale.y += (this.bbY - this.bb.scale.y) * a;
      if (Math.abs(this.grow - this.growGoal) > .002){ this.grow += (this.growGoal - this.grow) * a; this.setH(); }
    }
  };
})();
